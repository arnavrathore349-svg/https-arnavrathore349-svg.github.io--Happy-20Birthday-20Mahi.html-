<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Mahi</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<audio id="song" loop preload="auto" src="assets/song.mp3"></audio>
<button id="mus" aria-label="Music on/off">♪ on</button>
<div class="stage" id="stage">
  <div class="leaf" id="l0" role="button" aria-label="Open the card"></div>
  <div class="leaf" id="l1"><div id="spot" role="button" aria-label="Tap the letter"></div><div id="dim"></div><img id="letter" alt="Birthday letter" src="assets/letter.webp"></div>
  <div class="leaf" id="l2"><div id="flames"></div><div id="wish"><h2>make a wish, Mahi</h2><p>close your eyes &amp; think it real ♡</p><button id="relight">relight</button></div><canvas id="conf"></canvas></div>
</div>
<div class="bar" id="bar"><span class="hint" id="hint">tap the cover to open ✿</span></div>
<div class="note hide" id="note"></div>
<div id="w2"><img id="w2i" alt="A wish for you" src="assets/wish-note.webp"><button id="relight2">relight</button></div>
<script src="script.js"></script></body></html>
